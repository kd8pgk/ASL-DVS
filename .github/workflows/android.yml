name: android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests, build and lint
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest assembleRelease lintRelease
      - name: Name the APK
        id: apk
        run: |
          v=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "NodeTalker-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: NodeTalker-${{ steps.apk.outputs.version }}
          path: NodeTalker-${{ steps.apk.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
      - name: Publish the test build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.apk.outputs.version }}
        run: |
          tag="android-v$V"
          title="Node Talker Mobile $V (test build)"
          notes="Test build for sideloading, signed with the shared key kept in the repository (android/app/debug.keystore), like every Node Talker Mobile build so far, so it installs over any of them. See changelogs/nodetalker_android.md."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "NodeTalker-$V.apk" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" "NodeTalker-$V.apk" --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
