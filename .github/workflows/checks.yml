name: checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    name: checks (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pyflakes and shellcheck
        run: |
          python -m pip install --quiet pyflakes
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      - name: CI self-tests
        run: python ci/test_ci.py
      - name: Node Talker transmit baseline tests
        run: python3 ci/test_talker_tx_baseline.py
      - name: Node Recorder raw baseline tests
        run: python3 ci/test_noderecorder_raw.py
      - name: Recording popup tests (Node Controller, Node Talker)
        run: python3 ci/test_recording_popups.py
      - name: Shared rpt.conf number tests (Node Controller, 44helper)
        run: python3 ci/test_rpt_shared.py
      - name: Link, tune and disconnect tests (Node Controller)
        run: python3 ci/test_nodecontrol_links.py
      - name: Link, tune and transmit tests (Node Talker)
        run: python3 ci/test_nodetalker_links.py
      - name: Services card tests (Node Talker)
        run: python3 ci/test_nodetalker_services.py
      - name: Link, tune and disconnect tests (Node Recorder)
        run: python3 ci/test_noderecorder_links.py
      - name: Slow link tests (Node Recorder)
        run: python3 ci/test_noderecorder_slowlink.py
      - name: Slow link tests (Pibrary)
        run: python3 ci/test_pibrary_slowlink.py
      - name: Login session and lockout rules (shared code)
        run: python3 ci/test_sessions.py
      - name: Login screen (shared look and eye)
        run: python3 ci/test_login_ui.py
      - name: Session adoption (Node Talker, Node Recorder, instmon)
        run: python3 ci/test_session_adoption.py
      - name: Services file tests (Node Controller pi02w, Node Talker)
        run: python3 ci/test_nodecontrol_services.py
      - name: instmon slow-link tests (compression, revalidation, keep-alive, polling)
        run: python3 ci/test_instmon_slowlink.py
      - name: Node Controller slow-link tests (keep-alive, revalidation, shared cookie, light page, polling)
        run: python3 ci/test_nodecontrol_slowlink.py
      - name: Node Talker slow-link tests (gzip, revalidation, shared cookie, light page, polling)
        run: python3 ci/test_nodetalker_slowlink.py
      - name: SysMon slow-link tests (keep-alive, revalidation, shared cookie, light page, polling)
        run: python3 ci/test_sysmon_slowlink.py
      - name: instmon download tests (gzip, resume, header peek, slow-line rules)
        run: python3 ci/test_instmon_downloads.py
      - name: instmon page layout tests (tabs, docked log)
        run: python3 ci/test_instmon_page.py
      - name: instmon tool tests (log, start at boot, free space, restore, daily check)
        run: python3 ci/test_instmon_tools.py
      - name: Node Talker baseline tests
        run: python3 ci/test_talker_baseline.py
      - name: Node Talker stream tests (login, handshake, origin, idle, listeners)
        run: python3 ci/test_talker_stream.py
      - name: Terminal Monitor tests (termon)
        run: sudo env PATH="$PATH" python3 ci/test_termon.py
      - name: Repo checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          ASL_REQUIRE_SHELLCHECK: "1"
          FULL: ${{ github.event_name == 'schedule' && '--all' || '' }}
        run: |
          case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA=origin/main ;; esac
          python ci/check_repo.py --base "$BASE_SHA" $FULL
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.63.0
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "ASL_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright/index.js" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
      - name: Set a random root password on this runner (authenticated tests)
        run: |
          PW="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          echo "::add-mask::$PW"
          echo "root:$PW" | sudo chpasswd
          echo "ASL_TEST_ROOT_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: Server tests (twelve servers, started through the launcher, stubbed hardware)
        run: sudo env PATH="$PATH" ASL_TEST_VIA_LAUNCHER=1 ASL_TEST_ROOT_PASSWORD="$ASL_TEST_ROOT_PASSWORD" python3 ci/test_servers.py
      - name: Security tests (headers, request shape, proxy, local key)
        run: sudo env PATH="$PATH" ASL_TEST_ROOT_PASSWORD="$ASL_TEST_ROOT_PASSWORD" python3 ci/test_security.py
      - name: Page tests (headless Chromium)
        run: sudo env PATH="$PATH" ASL_TEST_PLAYWRIGHT_MODULE="$ASL_TEST_PLAYWRIGHT_MODULE" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" ASL_TEST_ROOT_PASSWORD="$ASL_TEST_ROOT_PASSWORD" python3 ci/test_pages.py
      - name: Authenticated tests (login, every route, badge truth)
        run: sudo env PATH="$PATH" ASL_TEST_PLAYWRIGHT_MODULE="$ASL_TEST_PLAYWRIGHT_MODULE" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" ASL_TEST_ROOT_PASSWORD="$ASL_TEST_ROOT_PASSWORD" python3 ci/test_authed.py
      - name: Install and uninstall tests (every pi02w and common tool)
        run: sudo env PATH="$PATH" ASL_TEST_INSTALL=1 python3 ci/test_install.py
      - name: Installer and uninstaller tests (optional tools, suite, fresh install, bootstrap, download only, stopped services)
        run: sudo env PATH="$PATH" ASL_TEST_INSTALL=1 python3 ci/test_installers.py
