name: promote-stable

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require the checks to have passed on the current main
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-list -1 HEAD -- . ':(exclude)channels/stable.json')
          concl=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --commit "$sha" --json conclusion -q '[.[] | select(.conclusion == "success")] | length')
          if [ "${concl:-0}" -gt 0 ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "The checks have not passed on $sha (the newest main commit that is not a stable.json update); not promoting."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Recompute and push channels/stable.json
        if: steps.green.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 ci/promote.py
            if git diff --quiet -- channels/stable.json && git ls-files --error-unmatch channels/stable.json >/dev/null 2>&1; then
              echo "No change to the stable channel."
              exit 0
            fi
            git add channels/stable.json
            git commit --quiet -m "Stable channel: recompute channels/stable.json"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push channels/stable.json after 3 attempts" >&2
          exit 1
