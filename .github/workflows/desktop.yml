name: desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Syntax check
        working-directory: desktop
        run: |
          for f in src/*.js ui/*.js test/*.js; do node --check "$f"; done
      - name: Unit tests
        working-directory: desktop
        run: npm test
      - name: Playwright
        run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
      - name: Smoke test
        working-directory: desktop
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: xvfb-run -a npm run smoke

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build the AppImage
        working-directory: desktop
        run: npm run dist
      - name: Check the package
        working-directory: desktop
        run: xvfb-run -a npm run check-package
      - name: Name the AppImage
        id: img
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          ls -l desktop/dist/NodeController-$v.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: NodeController-${{ steps.img.outputs.version }}
          path: desktop/dist/NodeController-${{ steps.img.outputs.version }}.AppImage
      - name: Publish the test build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.img.outputs.version }}
        run: |
          tag="desktop-v$V"
          title="Node Controller Desktop $V (test build)"
          notes="Linux test build, one AppImage. Not signed. See changelogs/nodecontroller_desktop.md."
          f="desktop/dist/NodeController-$V.AppImage"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$f" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" "$f" --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
