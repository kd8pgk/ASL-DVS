<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node Controller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <div class="brand">Node Controller</div>
  <div class="bar">
    <button id="add" type="button" class="primary">Add node</button>
    <button id="import" type="button">Import</button>
    <button id="export" type="button">Export</button>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div id="side-scroll">
    <section id="slots-box"></section>
    <section id="singles-box" class="sec">
      <div class="sec-head">Single pages</div>
      <ul id="singles" class="entries"></ul>
    </section>
    <section class="sec">
      <div class="sec-head">Open a page</div>
      <ul id="nodes"></ul>
    </section>
    <div id="splits-box" class="splits" hidden>
      <div class="splits-head">Saved splits</div>
      <ul id="splits"></ul>
    </div>
  </div>
  <div id="ver" class="ver"></div>
</aside>
<main id="main">
  <header id="head">
    <div id="tabs" role="tablist"></div>
    <div id="views" class="seg" role="group" aria-label="View">
      <button type="button" data-view="single" title="Show the focused page by itself (Ctrl+1)">Single</button>
      <button type="button" data-view="slots" title="Show the pages in the Left, Right and Lower slots (Ctrl+2)">Slots</button>
    </div>
    <button id="save-split" type="button" title="Save this split" disabled>Save split</button>
    <button id="reload" type="button" title="Reload (Ctrl+R)" disabled>Reload</button>
  </header>
</main>
<div id="panes"></div>
<dialog id="dlg">
  <form id="form" method="dialog" autocomplete="off">
    <h2 id="dlg-title">Add node</h2>
    <label>Name<input id="f-name" type="text" maxlength="80"></label>
    <label>Address<input id="f-host" type="text" placeholder="pi.local or https://pi.local" required></label>
    <label class="check"><input id="f-https" type="checkbox"> Use https</label>
    <div id="f-ports" class="two"></div>
    <label>Away address (Node Talker only)<input id="f-away" type="text" placeholder="https://node.example.com"></label>
    <label>LAN address (IPv4, optional)<input id="f-lan" type="text" placeholder="192.168.1.50"></label>
    <div id="f-pin-row" class="pin" hidden>
      <span>Trusted certificate</span>
      <span id="f-pin" class="mono"></span>
      <button id="f-pin-clear" type="button">Forget</button>
    </div>
    <p id="f-error" class="error" hidden></p>
    <div class="row end">
      <button id="f-delete" type="button" class="danger" hidden>Delete</button>
      <div class="spacer"></div>
      <button id="f-cancel" type="button">Cancel</button>
      <button id="f-save" type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<dialog id="dlg-name">
  <form id="form-name" method="dialog" autocomplete="off">
    <h2>Save split</h2>
    <label>Name<input id="n-name" type="text" maxlength="40" required></label>
    <p id="n-error" class="error" hidden></p>
    <div class="row end">
      <div class="spacer"></div>
      <button id="n-cancel" type="button">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<div id="menu" class="menu" role="menu" hidden></div>
<script src="app.js"></script>
</body>
</html>
